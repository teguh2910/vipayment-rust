# Public entry point for the vipayment backend at https://vipsdk.ttmi.my.id
#
# Install on the host that runs `docker compose up -d`:
#   sudo cp deploy/nginx/vipsdk.ttmi.my.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/vipsdk.ttmi.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=vipsdk_order:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=vipsdk_general:10m rate=240r/m;

upstream vipayment_server {
    # docker-compose.yml publishes vipayment-server here (127.0.0.1 only).
    server 127.0.0.1:8089;
    keepalive 16;
}

# ---- HTTP: ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name vipsdk.ttmi.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vipsdk.ttmi.my.id;

    ssl_certificate     /etc/letsencrypt/live/vipsdk.ttmi.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vipsdk.ttmi.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;
    client_body_timeout  30s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Health check
    location = /api/v1/health {
        proxy_pass http://vipayment_server;
        proxy_read_timeout 20s;
    }

    # Order endpoints: rate limited
    location ~ ^/api/v1/orders(/.*)?$ {
        limit_req zone=vipsdk_order burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://vipayment_server;
        proxy_read_timeout 30s;
    }

    # General API (products, etc.)
    location /api/v1/ {
        limit_req zone=vipsdk_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://vipayment_server;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
