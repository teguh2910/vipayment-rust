# Public entry point for the vipayment backend at https://vipsdk.ttmi.my.id
#
# Install on the host that runs `docker compose up -d`:
#   sudo cp deploy/nginx/vipsdk.ttmi.my.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/vipsdk.ttmi.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Only the gateway is proxied. catalog/order/fulfillment stay on the internal
# Docker network and must never be exposed: their /internal/* routes trust a
# shared secret, not a public caller.
#
# CORS is NOT configured here. The gateway owns every Access-Control-* header;
# adding them in two places produces duplicates and browsers reject the
# response. Control allowed origins with WEB_ORIGIN in apps/gateway/.env.

# Order creation is the expensive, abusable endpoint: 12 requests/minute per IP.
limit_req_zone $binary_remote_addr zone=vipsdk_order:10m rate=12r/m;
# Catalog reads and invoice polling are generous but still bounded.
limit_req_zone $binary_remote_addr zone=vipsdk_general:10m rate=240r/m;

upstream vipayment_gateway {
    # docker-compose.yml publishes the gateway here (127.0.0.1 only).
    server 127.0.0.1:8089;
    keepalive 16;
}

# ---- HTTP: ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name vipsdk.ttmi.my.id;

    # Matches the webroot used by the other sites on this host.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    # nginx 1.24 (Ubuntu 24.04) needs the http2 flag on listen; the standalone
    # `http2 on;` directive only exists from 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vipsdk.ttmi.my.id;

    ssl_certificate     /etc/letsencrypt/live/vipsdk.ttmi.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vipsdk.ttmi.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Gateway caps JSON bodies at 3 MB and proofs at 2 MB; leave headroom for
    # multipart framing.
    client_max_body_size 4m;
    client_body_timeout  30s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Health checks stay available even while the API is under load.
    location = /api/v1/health {
        proxy_pass http://vipayment_gateway;
        proxy_read_timeout 20s;
    }

    # POST /api/v1/orders only (order creation). Cheap to spam, so metered.
    location = /api/v1/orders {
        limit_req zone=vipsdk_order burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://vipayment_gateway;
        proxy_read_timeout 30s;
    }

    # Admin catalog sync can run long; keep the read timeout generous.
    location /api/v1/ {
        limit_req zone=vipsdk_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://vipayment_gateway;
        proxy_read_timeout 180s;
    }

    # Group logos are immutable: cache hard at the edge and in the browser.
    location /logos/ {
        proxy_pass http://vipayment_gateway;
        expires 7d;
    }

    # Payment proofs are private. `expires -1` disables caching, and the
    # security headers are repeated because nginx drops inherited add_header
    # directives in any location that declares its own.
    location /uploads/ {
        proxy_pass http://vipayment_gateway;
        expires -1;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Nothing else is public on this hostname.
    location / {
        return 404;
    }
}
