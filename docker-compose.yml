services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_BIN: vipayment-server
        SERVICE_PORT: 8080
    env_file:
      - ./apps/server/.env
    environment:
      BIND_ADDR: 0.0.0.0:8080
      VIPAYMENT_API_ID: ${VIPAYMENT_API_ID}
      VIPAYMENT_API_KEY: ${VIPAYMENT_API_KEY}
      VIPAYMENT_BASE_URL: ${VIPAYMENT_BASE_URL:-https://vip-reseller.co.id/api}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "127.0.0.1:8089:8080"
    restart: unless-stopped
