[package]
name = "vipayment-catalog"
version = "0.1.0"
edition = "2021"
description = "Catalog service: provider catalog sync, pricing, and storefront reads"
license = "MIT"
publish = false

[dependencies]
vipayment-shared = { path = "../shared" }
vipayment = { path = "../.." }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
wiremock = "0.6"
