[package]
name = "vipayment-fulfillment"
version = "0.1.0"
edition = "2021"
description = "Fulfillment service: submits paid orders to the provider and polls their status"
license = "MIT"
publish = false

[dependencies]
vipayment-shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
wiremock = "0.6"
axum = "0.8"
