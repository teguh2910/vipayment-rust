[package]
name = "vipayment-migrate"
version = "0.1.0"
edition = "2021"
description = "One-off migration from the legacy monolithic database to catalog.db and orders.db"
license = "MIT"
publish = false

[dependencies]
vipayment-shared = { path = "../shared" }
vipayment-catalog = { path = "../catalog-service" }
vipayment-order = { path = "../order-service" }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
