[workspace]
members = ["apps/shared", "apps/catalog-service", "apps/order-service", "apps/fulfillment-service", "apps/gateway", "apps/migrate"]
default-members = ["."]
resolver = "2"

[package]
name = "vipayment"
version = "0.1.0"
edition = "2021"
authors = ["Ahmad Andika Khoirul Amin <ahmdaka@gmail.com>", "Teguh <teguh@example.com>"]
description = "Official-style VIPayment (VIP Reseller) API client SDK for Rust"
license = "MIT"
repository = "https://github.com/teguh2910/vipayment-rust"
keywords = ["vipayment", "vip-reseller", "payment", "ppob", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10"
hex = "0.4"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
blocking = ["reqwest/blocking"]

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

